# HyperFix chat-light : build + push de l'image sim allégée.
# Déclenché sur push de la branche hyperfix-chat-light (et manuel).
# Image : ghcr.io/samalehzen/sim-light (VPS = thin layer façon nao-gamme).
name: chat-light-image

on:
  push:
    branches: [hyperfix-chat-light]
    paths:
      - 'apps/sim/**'
      - 'packages/**'
      - 'docker/app.Dockerfile'
      - 'bun.lock'
      - '.github/workflows/chat-light-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samalehzen/sim-light

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk (Android, dotnet, GHC, old images)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Fallocate swapfile (8G via dd, best effort)
        continue-on-error: true
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          ls -lh /swapfile

      - name: Mkswap and swapon (best effort)
        continue-on-error: true
        run: |
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Probe disk and memory (telemetry via annotations)
        run: |
          echo "::notice ::DISK_ROOT $(df -h / | tail -1 | tr -s ' ')"
          echo "::notice ::MEMINFO $(free -h | tr '\n' '|')"
          echo "::notice ::SWAPFILE $(ls -lh /swapfile 2>&1)"
          echo "::notice ::SWAPON_CHECK $(swapon --show 2>&1 | tr '\n' '|')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push (plain logs -> build.log)
        run: |
          CACHE_IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          CACHE_ARGS="--cache-to type=registry,ref=$CACHE_IMG,mode=max"
          if docker manifest inspect $CACHE_IMG >/dev/null 2>&1; then
            CACHE_ARGS="--cache-from type=registry,ref=$CACHE_IMG $CACHE_ARGS"
            echo "::notice ::CACHE_HIT build avec cache registry"
          else
            echo "::notice ::CACHE_MISS premier build sans cache"
          fi
          docker buildx build \
            --file ./docker/app.Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            $CACHE_ARGS \
            --push \
            --progress=plain . > build.log 2>&1; echo "DOCKER_EXIT=$?" >> $GITHUB_ENV; tail -n 5 build.log; exit 0

      - name: Exfiltrer erreurs vers annotations (si echec)
        if: always()
        run: |
          echo "DOCKER_EXIT=${DOCKER_EXIT:-killed-before-echo}"
          if [ -f build.log ]; then grep -i -m 30 -E "error|failed|Error:|ERR_|cannot|not found|Module not found" build.log | head -c 6000 | while IFS= read -r line; do echo "::error ::$line"; done; else echo "::error ::pas de build.log (shell tue avant la fin)"; fi
          test "${DOCKER_EXIT:-1}" = "0"
