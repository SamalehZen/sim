# HyperFix chat-light : build + push de l'image sim allégée.
# Déclenché sur push de la branche hyperfix-chat-light (et manuel).
# Image : ghcr.io/samalehzen/sim-light (VPS = thin layer façon nao-gamme).
name: chat-light-image

on:
  push:
    branches: [hyperfix-chat-light]
    paths:
      - 'apps/sim/**'
      - 'packages/**'
      - 'docker/app.Dockerfile'
      - 'bun.lock'
      - '.github/workflows/chat-light-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samalehzen/sim-light

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk (Android, dotnet, GHC, old images)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Fallocate swapfile (8G via dd, best effort)
        continue-on-error: true
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          ls -lh /swapfile

      - name: Mkswap and swapon (best effort)
        continue-on-error: true
        run: |
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Probe disk and memory (telemetry via annotations)
        run: |
          echo "::notice ::DISK_ROOT $(df -h / | tail -1 | tr -s ' ')"
          echo "::notice ::MEMINFO $(free -h | tr '\n' '|')"
          echo "::notice ::SWAPFILE $(ls -lh /swapfile 2>&1)"
          echo "::notice ::SWAPON_CHECK $(swapon --show 2>&1 | tr '\n' '|')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
